[tool.poetry]
name = "android-tv-cli-manager"
version = "0.1.0"
description = "A robust CLI tool to manage apps, packages, and permissions on Android/Google TV devices via ADB."
authors = ["Davyd Eduardo <davyd.e@globomail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/davyd9/android-tv-cli-manager"
keywords = ["android", "tv", "adb", "cli", "bloatware", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
    "Topic :: Terminals",
    "Topic :: Utilities"
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
typer = {extras = ["rich"], version = "^0.12.3"}
shellingham = "^1.5.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-cov = "^5.0.0"
ruff = "^0.4.8"
mypy = "^1.10.0"

[tool.poetry.scripts]
atv-cli = "android_tv_cli_manager.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "UP", "S"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=android_tv_cli_manager --cov-report=term-missing"
testpaths = [
    "tests",
]
